<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR amaliy mashg'ulot</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; touch-action: none; }
    #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
    #stage { position: fixed; inset: 0; z-index: 1; perspective: 700px;
             display: flex; align-items: center; justify-content: center; }
    #cube { position: relative; width: 160px; height: 160px; transform-style: preserve-3d; }
    .f { position: absolute; width: 160px; height: 160px; box-sizing: border-box;
         border: 3px solid #fff; display: flex; align-items: center; justify-content: center;
         font: bold 20px sans-serif; color: #fff; text-align: center; }
    .front  { background: rgba(33,150,243,.75);  transform: translateZ(80px); }
    .back   { background: rgba(255,87,34,.75);   transform: rotateY(180deg) translateZ(80px); }
    .right  { background: rgba(76,175,80,.75);   transform: rotateY(90deg) translateZ(80px); }
    .left   { background: rgba(255,193,7,.75);   transform: rotateY(-90deg) translateZ(80px); }
    .top    { background: rgba(156,39,176,.75);  transform: rotateX(90deg) translateZ(80px); }
    .bottom { background: rgba(0,188,212,.75);   transform: rotateX(-90deg) translateZ(80px); }
    #title { position: fixed; top: 12%; width: 100%; text-align: center; z-index: 2;
             color: #ff0; font: bold 28px sans-serif; text-shadow: 0 0 6px #000; }
    #btn { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 9999;
           padding: 14px 24px; font-size: 18px; border: 0; border-radius: 10px;
           background: #2196F3; color: #fff; }
    #info { position: fixed; top: 8px; left: 8px; z-index: 9999; color: #fff;
            font: 13px sans-serif; background: rgba(0,0,0,.6); padding: 5px 9px; border-radius: 6px; }
  </style>
</head>
<body>
  <video id="cam" autoplay playsinline muted></video>
  <div id="title">Samarqand davlat universiteti</div>
  <div id="stage">
    <div id="cube">
      <div class="f front">AR<br>amaliyot</div>
      <div class="f back">VR/AR</div>
      <div class="f right">SamDU</div>
      <div class="f left">Samarqand</div>
      <div class="f top">3D</div>
      <div class="f bottom">Kub</div>
    </div>
  </div>
  <div id="info">JS ishlayapti. Kubni barmoq bilan aylantiring</div>
  <button id="btn">Kamerani yoqish</button>

  <script>
    var cube = document.getElementById('cube');
    var rx = -20, ry = 0, dragging = false, lx = 0, ly = 0;

    function loop() {
      if (!dragging) ry += 0.6;
      cube.style.transform = 'rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
      requestAnimationFrame(loop);
    }
    loop();

    var stage = document.getElementById('stage');
    stage.addEventListener('pointerdown', function (e) { dragging = true; lx = e.clientX; ly = e.clientY; });
    window.addEventListener('pointerup', function () { dragging = false; });
    window.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      ry += (e.clientX - lx) * 0.5;
      rx -= (e.clientY - ly) * 0.5;
      lx = e.clientX; ly = e.clientY;
    });

    document.getElementById('btn').addEventListener('click', async function () {
      try {
        var stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } }, audio: false
        });
        document.getElementById('cam').srcObject = stream;
        this.style.display = 'none';
      } catch (e) {
        alert('Kamera xatosi: ' + e.message);
      }
    });
  </script>
</body>
</html>
