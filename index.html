<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR amaliy mashg'ulot</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; }
    #cam { position: fixed; top: 0; left: 0; width: 100%; height: 100%;
           object-fit: contain; background: #000; z-index: -1; }
    #btn { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999;
           padding: 14px 24px; font-size: 18px; border: 0; border-radius: 10px;
           background: #2196F3; color: #fff; }
    #info { position: fixed; top: 10px; left: 10px; z-index: 9999; color: #fff;
            font: 14px sans-serif; background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 6px; }
  </style>
</head>
<body>
  <video id="cam" autoplay playsinline muted></video>
  <div id="info">A-Frame yuklanmoqda...</div>
  <button id="btn">Kamerani yoqish</button>

  <a-scene vr-mode-ui="enabled: false" renderer="alpha: true"
           device-orientation-permission-ui="enabled: false">
    <a-box position="-1 0 -4" width="1.2" height="1.2" depth="1.2" color="#2196F3"
           animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"></a-box>
    <a-sphere position="1.2 0.2 -4" radius="0.7" color="#FF5722"></a-sphere>
    <a-cylinder position="0 -1.2 -4" radius="0.5" height="1" color="#4CAF50"></a-cylinder>
    <a-text value="TUIT Samarqand" position="0 1.6 -4" align="center" color="#FFFF00" width="8"></a-text>
    <a-light type="ambient" color="#ffffff"></a-light>
    <a-entity camera position="0 0 0" look-controls></a-entity>
  </a-scene>

  <script>
    var info = document.getElementById('info');
    var scene = document.querySelector('a-scene');
    if (scene.hasLoaded) { info.textContent = 'A-Frame ishlayapti'; }
    else { scene.addEventListener('loaded', function () { info.textContent = 'A-Frame ishlayapti'; }); }

    document.getElementById('btn').addEventListener('click', async function () {
      try {
        var stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } }, audio: false
        });
        document.getElementById('cam').srcObject = stream;
        this.style.display = 'none';
      } catch (e) {
        alert('Kamera xatosi: ' + e.message);
      }
    });
  </script>
</body>
</html>
