<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR amaliy mashg'ulot</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #cam { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
    a-scene { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    #btn { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
           padding: 14px 24px; font-size: 18px; border: 0; border-radius: 10px; background: #2196F3; color: #fff; }
  </style>
</head>
<body>
  <video id="cam" autoplay playsinline muted></video>
  <button id="btn">Kamerani yoqish</button>

  <a-scene embedded vr-mode-ui="enabled: false"
           renderer="alpha: true"
           background="transparent: true">
    <a-box position="-1 0 -3" color="#2196F3"
           animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"></a-box>
    <a-sphere position="1 0.2 -3" radius="0.5" color="#FF5722"></a-sphere>
    <a-cylinder position="0 -0.8 -3" radius="0.4" height="0.8" color="#4CAF50"></a-cylinder>
    <a-text value="TUIT Samarqand" position="0 1.2 -3" align="center" color="#FFFF00" width="6"></a-text>
    <a-entity camera look-controls="touchEnabled: true"></a-entity>
  </a-scene>

  <script>
    document.getElementById('btn').addEventListener('click', async function () {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } }, audio: false
        });
        document.getElementById('cam').srcObject = stream;
        this.style.display = 'none';
      } catch (e) {
        alert('Kamera xatosi: ' + e.message);
      }
    });
  </script>
</body>
</html>
